name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore: [extensions/dash/**]
  push:
    branches: [main]
    paths-ignore: [extensions/dash/**]
  workflow_dispatch:
  workflow_call:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Run unit tests
        run: pnpm exec vp test --run

  e2e-tests:
    name: E2E tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let every shard finish so we see all failures, not just the first
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
