name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      # package-exports.test.ts inspects the svelte-package output, which `prepare` no longer builds
      - name: Build component library
        run: pnpm package:dist
      - name: Run unit tests
        run: pnpm exec vp test --run

  # Regression tripwires for the hot paths measured in #438 (tests/vitest/perf-baselines.test.ts).
  # Opt-in locally (MATTERVIZ_PERF=1) and its own job here so its medians-of-N neither slow the
  # unit job nor share a CPU with it.
  perf-baselines:
    name: Perf baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung mount would otherwise hold the runner for GitHub's 6 h default
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Run perf baselines
        run: pnpm exec vp test --run tests/vitest/perf-baselines.test.ts
        env:
          MATTERVIZ_PERF: 1

  e2e-tests:
    name: E2E tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let every shard finish so we see all failures, not just the first
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
