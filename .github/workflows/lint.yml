name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  prek:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      # install extension deps too: vscode is type-aware linted by root oxlint
      # (needs e.g. @types/vscode), anywidget is checked by root svelte-check
      # (needs its matterviz/* subpath imports to resolve, else TS2882)
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          extensions: vscode anywidget jupyterlab
      - name: Run prek checks
        uses: j178/prek-action@v2

      # The root tsconfig excludes extensions/, and `vite build` strips types without
      # checking them, so extensions/vscode/tsconfig.json never ran anywhere. The
      # extension imports $lib types directly (file-viewer/eligibility, io/decompress,
      # trajectory/format-detect), so a change to a shared type broke it silently -
      # e.g. making HostFileRequest.filename required produced four errors nothing caught.
      - name: Type-check VS Code extension
        run: pnpm -C extensions/vscode run typecheck

      # Its settings and custom-editor selectors are generated from $lib, but only by a local
      # prebuild, so a change to the shared lists could land with package.json left behind.
      - name: Check VS Code package.json is in sync with $lib
        run: pnpm -C extensions/vscode run sync-config -- --check

      # Same blind spot as vscode: this tsconfig ran nowhere. verify-deps-before-run is off
      # because pnpm re-runs `install` before `run`, which fails over the ignored fontawesome
      # build script even immediately after a successful install.
      - name: Type-check and test JupyterLab extension
        env:
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
        run: |
          pnpm -C extensions/jupyterlab run typecheck
          pnpm -C extensions/jupyterlab test

  knip:
    name: Check unused code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Check for unused dependencies and exports
        run: pnpm run knip

  publint:
    name: Validate npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Validate package exports and types
        run: pnpm run publint
