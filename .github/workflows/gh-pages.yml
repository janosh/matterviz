name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          extensions: anywidget

      # adapter-static won't follow symlinks out of static/, so replace each
      # static/<dir> -> ../src/site/<dir> symlink with a real copy (auto-discovered)
      - name: Materialize static data symlinks
        run: |
          for link in static/*; do
            [ -L "$link" ] || continue
            target="$(readlink "$link")"
            case "$target" in ../src/site/*) rm "$link"; cp -r "${target#../}" "$link" ;; esac
          done

      - name: Build site
        run: pnpm run build:site

      # Serves main's widget bundle at /anywidget/matterviz.{js,css}: pymatviz's main branch
      # loads it (MATTERVIZ_ANYWIDGET_VERSION = "main") until an npm release pins a version
      - name: Build anywidget bundle into the site
        run: |
          pnpm -C extensions/anywidget run build
          cp -r extensions/anywidget/build build/anywidget

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy documentation site
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
