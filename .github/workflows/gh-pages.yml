name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/setup

      # adapter-static won't follow symlinks out of static/, so replace each
      # static/<dir> -> ../src/site/<dir> symlink with a real copy (auto-discovered)
      - name: Materialize static data symlinks
        run: |
          for link in static/*; do
            [ -L "$link" ] || continue
            target="$(readlink "$link")"
            case "$target" in ../src/site/*) rm "$link"; cp -r "${target#../}" "$link" ;; esac
          done

      - name: Build site
        run: pnpm run build:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy documentation site
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
