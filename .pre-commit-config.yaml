default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: ty check
        language: python
        types: [python]
        additional_dependencies: [ty]
        args:
          - --output-format
          - concise
          - --ignore
          - unresolved-import
          - --ignore
          - unresolved-attribute

  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: vp-fmt
        name: Format (oxfmt)
        entry: pnpm exec vp check --fix
        types_or: [file]
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: svelte-check
        name: Svelte type check
        entry: bash -c "npx svelte-kit sync && npx svelte-check --tsconfig ./tsconfig.json --threshold warning"
        language: system
        types_or: [ts, svelte]
        pass_filenames: false

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-jsonschema
        name: Validate element data JSON
        files: ^src/lib/element/data\.json$
        args: [--schemafile, src/lib/element/data.schema.json]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        stages: [pre-commit, commit-msg]
        args:
          - --ignore-words-list
          # statics: static (single-point) calculations
          # conect: PDB bond-connectivity record name; trough: a dip in a curve
          # skelton: Jonathan Michael Skelton, author of the cited Phonopy-Spectroscopy
          # cna: common neighbor analysis; mater: journal abbreviation (Acta Mater.)
          - 'te,ba,nd,ore,claus,manuel,ges,mey,curvelinear,tennant,struc,slac,statics,conect,trough,skelton,cna,mater'
          - --check-filenames

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # MD013: line too long
        # MD033: no inline HTML
        # MD041: first line in a file should be a top-level heading
        args: [--disable, MD013, MD033, MD041, '--']
        exclude: changelog\.md$
