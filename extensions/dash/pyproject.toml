[build-system]
requires = ["uv_build>=0.11.32"]
build-backend = "uv_build"

[project]
name = "matterviz-dash-components"
version = "0.4.3"
description = "Plotly Dash wrapper for MatterViz (Svelte) components"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "matterviz-dash-components contributors" }]
dependencies = ["dash>=4.4.1"]

[project.optional-dependencies]
dev = ["pytest-playwright>=0.8.0", "pytest>=9.1.1"]

[tool.uv.build-backend]
module-root = "" # flat layout: the module sits next to pyproject.toml
source-exclude = [".DS_Store"] # uv_build ships the whole module dir verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
# Playwright tests require: pip install pytest-playwright && playwright install chromium

[tool.ruff]
extend-exclude = ["**/typed.py"] # auto-generated file

[tool.ruff.lint.per-file-ignores]
# Dash resolves components by module name, which must match the React component
"matterviz_dash_components/MatterViz.py" = ["N999"]
