<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="author" content="Janosh Riebesell" />
    <title>MatterViz</title>
    <meta
      name="description"
      content="Interactive visualizations for materials science: periodic tables, 3D structures, MD trajectories and more."
    />

    <meta name="og:card" content="summary" />
    <meta name="twitter:site" content="@jrib_" />
    <meta name="twitter:creator" content="@jrib_" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/janosh/matterviz/main/static/favicon.svg"
    />
    <meta property="og:image:alt" content="MatterViz logo" />

    <script
      defer
      data-domain="matterviz.janosh.dev"
      src="https://plausible.io/js/plausible.js"
    ></script>

    <link rel="icon" href="/favicon.svg" />
    <!-- math display -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"
    />

    <script>
      // Theme before first paint: app.css defines every token as light-dark(), so the only
      // state to restore is which palette (data-theme) and which scheme the root resolves with
      let mode = 'auto'
      try {
        mode = localStorage['matterviz-theme'] || 'auto'
      } catch {}
      const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      const resolved = mode === 'auto' ? system : mode
      document.documentElement.dataset.theme = resolved
      document.documentElement.style.colorScheme = ['dark', 'black'].includes(resolved)
        ? 'dark'
        : 'light'
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
