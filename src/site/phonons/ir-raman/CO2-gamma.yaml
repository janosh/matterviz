# SYNTHETIC FIXTURE - not the output of any DFT or phonopy run.
#
# A single CO2 molecule in a 12 A cubic box, Gamma point only, written in phonopy
# band.yaml style. Provenance of each number:
#   - eigenvectors: EXACT. Every one of the 9 modes of a linear symmetric XY2
#     molecule is fixed by D_inf_h symmetry plus orthogonality to the translations,
#     so no force constants are needed. Written in phonopy's convention: eigenvectors
#     of the mass-weighted dynamical matrix, sum |e|^2 = 1, displacement = e/sqrt(M).
#   - vibrational frequencies: experimental gas-phase CO2 fundamentals,
#     nu2 = 667 cm^-1 (bend, doubly degenerate), nu1 = 1333 cm^-1 (symmetric stretch),
#     nu3 = 2349 cm^-1 (antisymmetric stretch), converted to THz.
#   - librations: set to a nominal 2 THz. In the gas phase these are free rotations at
#     0 THz; a nonzero value keeps the three acoustic translations unambiguously the
#     three lowest modes.
#   - masses: standard atomic weights.
#
# Point group D_inf_h is centrosymmetric, so the modes obey mutual exclusion:
# nu1 and the librations are gerade (Raman only), nu2 and nu3 are ungerade (IR only).
nqpoint: 1
natom: 3
lattice:
  - [12.00000000000000, 0.00000000000000, 0.00000000000000]
  - [0.00000000000000, 12.00000000000000, 0.00000000000000]
  - [0.00000000000000, 0.00000000000000, 12.00000000000000]
